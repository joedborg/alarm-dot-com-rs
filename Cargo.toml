[package]
name = "alarm-dot-com"
version = "0.1.0"
edition = "2024"
description = "Rust library for interfacing with Alarm.com security panels"
license = "MIT"
repository = "https://github.com/joedborg/alarm-dot-com-rs"
documentation = "https://docs.rs/alarm-dot-com"
keywords = ["alarm", "security", "smart-home", "alarm-dot-com", "adt"]
categories = ["api-bindings", "network-programming"]

[dependencies]
reqwest = { version = "0.13.2", features = ["cookies", "json", "form"] }
scraper = "0.25.0"
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
thiserror = "2.0.18"
tokio = { version = "1.0.0", features = ["full"] }
tracing = "0.1.0"
url = "2.0.0"
regex = "1.0.0"

[dev-dependencies]
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }


[[example]]
name = "status"
path = "examples/status.rs"

[[example]]
name = "arm"
path = "examples/arm.rs"
